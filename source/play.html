<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cartridge player</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
#game{width:100%;height:100%}
#err{display:none;position:fixed;inset:0;color:#ececf1;font:15px/1.5 system-ui,sans-serif;padding:24px;text-align:center;align-items:center;justify-content:center}
</style>
</head>
<body>
<script src="pad.js"></script>
<div id="game"></div>
<div id="err"></div>
<script>
"use strict";
/* Hosts EmulatorJS (RetroArch cores, GPL-3.0) for one game. Opened by index.html as play.html#<romId>. */
const CORES = {
  gb: "gambatte", gbc: "gambatte", gba: "mgba", snes: "snes9x",
  genesis: "genesis_plus_gx", sms: "genesis_plus_gx", gg: "genesis_plus_gx",
  n64: "mupen64plus_next", psx: "pcsx_rearmed", a2600: "stella2014",
  pce: "mednafen_pce", lynx: "handy", arcade: "fbneo", mame: "mame2003_plus",
};
const ARCADE = ["arcade", "mame"];
const post = (msg) => { try { parent.postMessage(Object.assign({ cartridge: true }, msg), location.origin); } catch {} };
function fail(text) {
  const e = document.getElementById("err");
  e.textContent = text; e.style.display = "flex";
  post({ type: "error", message: text });
}
function allRoms() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("cartridge", 1);
    r.onsuccess = () => { const t = r.result.transaction("roms", "readonly").objectStore("roms").getAll(); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); };
    r.onerror = () => rej(r.error);
  });
}
function getRom(id) {
  return new Promise((res, rej) => {
    const r = indexedDB.open("cartridge", 1);
    r.onsuccess = () => {
      const t = r.result.transaction("roms", "readonly").objectStore("roms").get(id);
      t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
    };
    r.onerror = () => rej(r.error);
  });
}

(async () => {
  let rom;
  try { rom = await getRom(decodeURIComponent(location.hash.slice(1))); } catch (e) { return fail("Couldn't open your game library on this device."); }
  if (!rom) return fail("That game isn't in your library any more.");
  const core = CORES[rom.system];
  if (!core) return fail("This system isn't supported yet.");

  // Pick the on-screen pad layout explicitly. EmulatorJS otherwise guesses from the core name, and
  // genesis_plus_gx (Genesis, Master System, Game Gear) is guessed as Master System = 2 buttons.
  const SCHEMES = { gb: "gb", gbc: "gb", gba: "gba", snes: "snes", genesis: "segaMD", sms: "segaMS", gg: "segaGG",
    n64: "n64", psx: "psx", a2600: "atari2600", pce: "pce", lynx: "lynx", arcade: "arcade", mame: "mame" };
  window.EJS_controlScheme = SCHEMES[rom.system];
  if (rom.system === "psx") {
    // EmulatorJS has no PlayStation pad, and its fallback lacks shoulder buttons.
    // RetroPad ids: B0 Y1 Select2 Start3 Up4 Down5 Left6 Right7 A8 X9 L10 R11 L2=12 R2=13
    window.EJS_VirtualGamepadSettings = [
      { type: "button", text: "△", id: "triangle", location: "right", left: 40, bold: true, input_value: 9 },
      { type: "button", text: "□", id: "square", location: "right", top: 40, bold: true, input_value: 1 },
      { type: "button", text: "○", id: "circle", location: "right", left: 81, top: 40, bold: true, input_value: 8 },
      { type: "button", text: "✕", id: "cross", location: "right", left: 40, top: 80, bold: true, input_value: 0 },
      { type: "dpad", id: "dpad", location: "left", left: "50%", top: "50%", joystickInput: false, inputValues: [4, 5, 6, 7] },
      { type: "button", text: "Start", id: "start", location: "center", left: 60, fontSize: 15, block: true, input_value: 3 },
      { type: "button", text: "Select", id: "select", location: "center", left: -5, fontSize: 15, block: true, input_value: 2 },
      { type: "button", text: "L1", id: "l1", location: "left", left: 3, top: -100, bold: true, block: true, input_value: 10 },
      { type: "button", text: "R1", id: "r1", location: "right", right: 3, top: -100, bold: true, block: true, input_value: 11 },
      { type: "button", text: "L2", id: "l2", location: "left", left: 75, top: -100, bold: true, block: true, input_value: 12 },
      { type: "button", text: "R2", id: "r2", location: "right", right: 75, top: -100, bold: true, block: true, input_value: 13 },
    ];
  }
  if (ARCADE.includes(rom.system)) {
    // RetroPad ids: B0 Y1 Coin2 Start3 Up4 Down5 Left6 Right7 A8 X9 L10 R11 — punches on top, kicks below (CPS-style)
    window.EJS_VirtualGamepadSettings = [
      { type: "button", text: "1", id: "b1", location: "right", right: 130, top: 10, bold: true, input_value: 1 },
      { type: "button", text: "2", id: "b2", location: "right", right: 68, top: 0, bold: true, input_value: 9 },
      { type: "button", text: "3", id: "b3", location: "right", right: 6, top: 10, bold: true, input_value: 10 },
      { type: "button", text: "4", id: "b4", location: "right", right: 130, top: 75, bold: true, input_value: 0 },
      { type: "button", text: "5", id: "b5", location: "right", right: 68, top: 65, bold: true, input_value: 8 },
      { type: "button", text: "6", id: "b6", location: "right", right: 6, top: 75, bold: true, input_value: 11 },
      { type: "dpad", id: "dpad", location: "left", left: "50%", top: "50%", joystickInput: false, inputValues: [4, 5, 6, 7] },
      { type: "button", text: "Coin", id: "coin", location: "center", left: -5, fontSize: 15, block: true, input_value: 2 },
      { type: "button", text: "Start", id: "start", location: "center", left: 60, fontSize: 15, block: true, input_value: 3 },
    ];
    // BIOS zips (neogeo.zip…) go in the same folder as the game, still zipped.
    let support = [];
    try { support = (await allRoms()).filter((r) => r.bios); } catch {}
    const putFiles = (fs) => {
      for (const b of support) { try { fs.writeFile(b.file, b.data); } catch (e) { console.warn("BIOS write failed", b.file, e); } }
    };
    const hook = setInterval(() => {
      if (!window.EJS_emulator) return;
      clearInterval(hook);
      window.EJS_emulator.on("saveDatabaseLoaded", putFiles);
    }, 5);
  }
  window.EJS_player = "#game";
  window.EJS_core = core;
  window.EJS_gameName = rom.id;                                  // saves + states are keyed by this
  // arcade cores identify the game by its set name (sf2.zip), so keep it
  window.EJS_gameUrl = new File([rom.data], ARCADE.includes(rom.system) && rom.file ? rom.file : `${rom.id}.${rom.ext}`);
  window.EJS_pathtodata = "ejs/";
  window.EJS_startOnLoaded = true;
  window.EJS_color = "#e5484d";
  window.EJS_backgroundColor = "#000000";
  window.EJS_language = "en-US";
  window.EJS_disableAutoLang = false;                             // don't fetch other languages (offline)
  const padAttached = new URLSearchParams(location.search).has("pad");
  window.EJS_defaultOptions = { "save-save-interval": "30" };     // flush in-game saves every 30 s
  if (padAttached) window.EJS_defaultOptions["virtual-gamepad"] = "disabled";  // Backbone etc.: no on-screen pad
  window.EJS_Buttons = { netplay: false, cacheManager: false, exitEmulation: false };
  window.EJS_ready = () => post({ type: "ready" });
  const setTouchPad = (on) => { try { window.EJS_emulator.changeSettingOption("virtual-gamepad", on ? "enabled" : "disabled"); } catch {} };
  // Friendlier physical-button defaults (EmulatorJS's put Genesis jump on ✕ and left □ unused).
  // RetroPad slot -> controller button. Applied only while the user hasn't customised controls.
  const LAYOUTS = {
    // Genesis A B C across □ ✕ ○, X Y Z on L1 △ R1 · Master System / Game Gear 1 2 on ✕ ○
    sega: { 1: "BUTTON_3", 0: "BUTTON_1", 8: "BUTTON_2", 9: "BUTTON_4", 10: "LEFT_TOP_SHOULDER", 11: "RIGHT_TOP_SHOULDER" },
    // Street Fighter style: punches □ △ R1, kicks ✕ ○ R2 · Neo Geo A B C D = ✕ ○ □ △
    arcade: { 1: "BUTTON_3", 9: "BUTTON_4", 10: "RIGHT_TOP_SHOULDER", 0: "BUTTON_1", 8: "BUTTON_2", 11: "RIGHT_BOTTOM_SHOULDER" },
  };
  const layout = ["genesis", "sms", "gg"].includes(rom.system) ? LAYOUTS.sega : ARCADE.includes(rom.system) ? LAYOUTS.arcade : null;
  function applyLayout() {
    const c = window.EJS_emulator?.controls?.[0];
    if (!layout || !c) return;
    const pristine = c[0]?.value2 === "BUTTON_2" && c[1]?.value2 === "BUTTON_4" && c[8]?.value2 === "BUTTON_1" && c[9]?.value2 === "BUTTON_3";
    if (!pristine) return;
    for (const k in layout) { c[k] = c[k] || {}; c[k].value2 = layout[k]; }
    try { window.EJS_emulator.checkGamepadInputs?.(); } catch {}
  }
  window.EJS_onGameStart = () => {
    applyLayout();
    setTouchPad(!padAttached);          // EmulatorJS remembers this per system, so set it every launch
    post({ type: "started" });
  };
  // Backbone clipped in (or a pad paired) mid-game: hide the on-screen pad
  window.addEventListener("gamepadconnected", () => { if (window.EJS_emulator?.started && !location.search.includes("touch=on")) setTouchPad(false); });

  const s = document.createElement("script");
  s.src = "ejs/loader.js";
  s.onerror = () => fail("The emulator files are missing. Reconnect once so they can download.");
  document.body.appendChild(s);
})();

/* parent asks us to save before the frame is removed */
window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data || e.data.cartridge !== true) return;
  if (e.data.type === "exit") {
    try {
      const emu = window.EJS_emulator;
      if (emu && emu.started && emu.gameManager) emu.gameManager.saveSaveFiles();
    } catch {}
    setTimeout(() => post({ type: "exited" }), 400);   // give IDBFS time to persist
  }
});
document.addEventListener("visibilitychange", () => {
  try { if (document.hidden && window.EJS_emulator?.started) window.EJS_emulator.gameManager.saveSaveFiles(); } catch {}
});
</script>
</body>
</html>
